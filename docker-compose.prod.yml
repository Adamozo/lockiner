# Production Docker Compose for LockIner
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Note: Frontend and backend bind to 127.0.0.1 only - use your own reverse proxy (nginx/caddy)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lockiner-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lockiner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lockiner_secret}
      - POSTGRES_DB=${POSTGRES_DB:-lockiner_db}
    networks:
      - lockiner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lockiner} -d ${POSTGRES_DB:-lockiner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lockiner-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/uploads:rw
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lockiner}:${POSTGRES_PASSWORD:-lockiner_secret}@postgres:5432/${POSTGRES_DB:-lockiner_db}
      - UPLOAD_DIR=/uploads
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://lockiner.com}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_CONTACT_EMAIL=${VAPID_CONTACT_EMAIL}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lockiner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Nuxt 4 Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lockiner-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lockiner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # MongoDB — katalog Open Food Facts
  mongodb:
    image: mongo:7
    container_name: lockiner-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - lockiner-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Meilisearch — wyszukiwanie produktów
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: lockiner-meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - lockiner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  lockiner-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  mongodb_data:
    driver: local
  meilisearch_data:
    driver: local
